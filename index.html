<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Epure">
<title>Epure — Compteurs</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script>
/* Applique le thème choisi AVANT le premier rendu. localStorage est
   synchrone, contrairement à IndexedDB : c'est ce qui évite l'éclair de
   couleur au démarrage quand le réglage contredit celui du système. */
(function () {
  try {
    var t = localStorage.getItem('epure-theme');
    if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
</head>
<body>

<header id="topbar">
  <button id="btn-back" class="icon-btn" hidden aria-label="Retour">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg>
  </button>
  <h1 id="title">Epure</h1>
  <button id="btn-theme" class="icon-btn" data-mode="auto" aria-label="Thème"></button>
  <button id="btn-settings" class="icon-btn" aria-label="Réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 7.5h9M17.5 7.5h3M3.5 16.5h3M11.5 16.5h9"/>
      <circle cx="15" cy="7.5" r="2.4"/><circle cx="9" cy="16.5" r="2.4"/>
    </svg>
  </button>
</header>

<div id="backup-warning" class="banner" hidden>
  <span id="backup-warning-text"></span>
  <button class="link" data-go="reglages">Sauvegarder</button>
</div>

<main id="app"><!-- écrans injectés ici --></main>

<nav id="tabbar">
  <button data-go="recap" class="tab active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
      <rect x="3.25" y="3.25" width="7.5" height="7.5" rx="2.2"/><rect x="13.25" y="3.25" width="7.5" height="7.5" rx="2.2"/>
      <rect x="3.25" y="13.25" width="7.5" height="7.5" rx="2.2"/><rect x="13.25" y="13.25" width="7.5" height="7.5" rx="2.2"/>
    </svg>
    Récap
  </button>
  <button id="tab-scan" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 8.5V6a2.5 2.5 0 0 1 2.5-2.5h2.5M15.5 3.5H18A2.5 2.5 0 0 1 20.5 6v2.5M20.5 15.5V18a2.5 2.5 0 0 1-2.5 2.5h-2.5M8.5 20.5H6A2.5 2.5 0 0 1 3.5 18v-2.5"/>
      <path d="M3.5 12h17"/>
    </svg>
    Scanner
  </button>
  <button data-go="archives" class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3.5" width="18" height="4.5" rx="1.6"/>
      <path d="M5 8v10.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V8M9.75 12h4.5"/>
    </svg>
    Archives
  </button>
</nav>

<!-- Scanner QR -->
<div id="scanner" class="overlay" hidden>
  <video id="scan-video" playsinline muted></video>
  <canvas id="scan-canvas" hidden></canvas>
  <div class="scan-frame"></div>
  <p id="scan-hint">Vise le QR code vert de la vignette ANM</p>
  <button id="scan-close" class="btn">Annuler</button>
</div>

<!-- Toast -->
<div id="toast" hidden></div>

<script src="vendor/jsqr.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
